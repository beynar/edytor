# Publishes the package to npm when a version tag (`v0.1.0-next.14`) is pushed.
# Trusted publishing (OIDC): npm trusts this workflow of beynar/edytor, no token.
# A pre-release (`-next.N`) goes under the `next` dist-tag, any other version
# under `latest`. Nothing is published unless CI (`ci.yml`, called here on
# the tagged commit with the Chromium lane) passed: the gate lanes count
# operations instead of timing them (CC-05), so they hold on shared runners.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml
    with:
      browsers: true

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The tag names the package's version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - name: Publish
        run: |
          tag=$(node -p '/-/.test(require("./package.json").version) ? "next" : "latest"')
          npm publish --tag "$tag"
