# Deploys the docs (edytor.dev) and the demo room on every push to master:
# `site`'s `pnpm run deploy` (pack, build, both Workers, smoke check).
# KEEP_LIVE: a version the site already serves keeps its live tarball (a pack
# on this runner may differ in bytes from the release's).
# Needs the CLOUDFLARE_API_TOKEN secret (Workers Scripts, Workers Routes on
# the edytor.dev zone).
name: Deploy docs

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        working-directory: site
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KEEP_LIVE: '1'
