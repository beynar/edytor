# Publishes the package to npm when a version tag (`v0.1.0-next.14`) is pushed.
# Trusted publishing (OIDC): npm trusts this workflow of beynar/edytor, no token.
# A pre-release (`-next.N`) goes under the `next` dist-tag, any other version
# under `latest`. The test lanes stay local (run before every release): their
# timing budgets do not hold on shared runners.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The tag names the package's version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm check:worker
      - name: Publish
        run: |
          tag=$(node -p '/-/.test(require("./package.json").version) ? "next" : "latest"')
          npm publish --tag "$tag"
